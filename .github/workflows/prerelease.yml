name: Pre-release
on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
    branches: [main]

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.repository == 'AxionCompany/oxian-js'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Build the npm package
        run: node scripts/build_npm.mjs ${{ github.event.workflow_run.head_sha }}
      - name: Publish to npm next
        working-directory: build/npm
        run: npm publish --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Mirror the same version to JSR
        run: node scripts/stamp_deno_version.mjs build/npm/package.json && deno publish --allow-dirty
