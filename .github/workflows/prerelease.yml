# npm trusts exactly this workflow file for oxianjs, so prereleases and stable
# releases both publish from here.
name: Publish
on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.repository == 'AxionCompany/oxian-js'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Build the npm package
        run: node scripts/build_npm.mjs ${{ github.event.workflow_run.head_sha }}
      - name: Publish to npm next
        working-directory: build/npm
        run: npm publish --provenance --access public --tag next
      - name: Mirror the same version to JSR
        run: node scripts/stamp_deno_version.mjs build/npm/package.json && deno publish --allow-dirty

  release:
    if: >-
      github.event_name != 'workflow_run' &&
      github.repository == 'AxionCompany/oxian-js'
    # A manual dispatch may select a branch or tag in the GitHub UI. Publishing
    # is permitted only from the exact version tag validated below.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate release tag
        run: >-
          deno run --allow-read=deno.json scripts/validate_publish_release.ts
          "${{ github.ref_name }}" "${{ github.ref }}"
      - name: Install Node toolchain
        run: npm ci
      # main's Verify already ran the Deno, Node and installed-package proofs on
      # this exact commit; publish only that verified revision, without rerunning.
      - name: Require a successful Verify for this exact main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100" \
            | jq --exit-status --arg sha "$GITHUB_SHA" \
              'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success")'
      - name: Build the npm package
        run: node scripts/build_npm.mjs
      - name: Publish package
        working-directory: build/npm
        run: npm publish --provenance --access public
      - name: Mirror the same version to JSR
        run: deno publish
