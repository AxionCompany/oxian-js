name: Publish
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    # A manual dispatch may select a branch or tag in the GitHub UI. Publishing
    # is permitted only from the exact version tag validated below.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate release tag
        run: >-
          deno run --allow-read=deno.json scripts/validate_publish_release.ts
          "${{ github.ref_name }}" "${{ github.ref }}"
      - name: Verify package
        run: deno task verify
      - name: Verify portable Node surface
        run: npm run check:node
      - name: Publish package
        run: deno publish
