name: Publish
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    # A manual dispatch may select a branch or tag in the GitHub UI. Publishing
    # is permitted only from the exact version tag validated below.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: oxian
          POSTGRES_PASSWORD: oxian
          POSTGRES_DB: oxian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxian -d oxian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://oxian:oxian@localhost:5432/oxian
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate release tag
        run: >-
          deno run --allow-read=deno.json scripts/validate_publish_release.ts
          "${{ github.ref_name }}" "${{ github.ref }}"
      - name: Verify package
        run: deno task verify
      - name: Verify portable Node surface
        run: npm run check:node
      - name: Install Node toolchain
        run: npm ci
      - name: Build the npm package
        run: node scripts/build_npm.mjs
      - name: Publish package
        working-directory: build/npm
        run: npm publish --provenance --access public
      - name: Mirror the same version to JSR
        run: deno publish
