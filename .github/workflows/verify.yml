name: Verify
on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

jobs:
  deno:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: oxian
          POSTGRES_PASSWORD: oxian
          POSTGRES_DB: oxian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxian -d oxian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://oxian:oxian@localhost:5432/oxian
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
      - run: deno task verify

  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: oxian
          POSTGRES_PASSWORD: oxian
          POSTGRES_DB: oxian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxian -d oxian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://oxian:oxian@localhost:5432/oxian
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
